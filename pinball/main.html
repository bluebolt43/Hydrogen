<!doctype html>
<html lang="zh-Hant">
<head>
<base href="./res/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="app.title">Pinball Tales</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/main.css">
<link rel="preload" as="image" href="img/touhou/touhou-loading-suika.webp">
<link rel="preload" as="image" href="img/chickeneren-logo.webp">
<script id="pinball-release-control">window.PinballReleaseControl=53;</script>
</head>
<body>
<section id="fanwork-notice" tabindex="-1">
<div><div class="studio-mark"><img src="img/chickeneren-logo.webp" width="96" height="96" alt=""><span>chickeneren</span></div>
<h1 data-i18n="notice.title">二次創作聲明</h1><p data-i18n="notice.touhouFanwork">本遊戲中的東方主題內容為《東方 Project》的非官方二次創作。</p>
<p data-i18n="notice.touhouCredits">《東方 Project》原作及相關角色、世界觀之著作權歸 ZUN／上海アリス幻樂団所有。</p>
<p data-i18n="notice.touhouInterpretation">本作包含獨自的詮釋與設定，可能與原作不同。</p>
</div>
</section>
<main id="main-frame" aria-label="彈珠台主畫面" inert>
<section id="theme-menu" aria-label="主題選擇"><canvas id="menu-art" aria-hidden="true"></canvas><div id="menu-animation" hidden></div><div id="menu-actions"></div></section>
<div id="screen" tabindex="0" hidden></div>
<div id="scene-transition" aria-hidden="true" hidden></div>
<div id="table-loading" role="status" aria-live="polite" hidden><span class="loading-icon" aria-hidden="true"><span class="loading-ball"></span><img class="loading-prayer" src="img/touhou/touhou-loading-suika.webp" alt=""></span><p id="loading-title" data-i18n="loading.title">加載中...</p></div>
<button id="open-settings" type="button" aria-label="開啟設定" data-i18n-aria-label="menu.settings"><img src="img/system-marker-settings.runtime.webp" alt=""></button>
<section id="unlock-dialog" role="dialog" aria-modal="true" aria-label="Unlock Table" hidden><canvas id="unlock-art" aria-hidden="true"></canvas><div id="unlock-actions"></div><p id="unlock-status" role="status"></p></section>
<dialog id="announcement-dialog" aria-labelledby="announcement-title">
<header><h1 id="announcement-title" data-i18n="announcement.title">公告</h1><button id="close-announcement" type="button" aria-label="關閉" data-i18n-aria-label="announcement.close">×</button></header>
<div id="announcement-content" tabindex="0" aria-live="polite"></div>
</dialog>
<dialog id="privacy-dialog" aria-labelledby="privacy-title">
<header><h1 id="privacy-title" data-i18n="legal.privacy">隱私權政策</h1><button id="close-privacy" type="button" aria-label="返回" data-i18n-aria-label="common.back"><img src="img/system-marker-back.runtime.webp" alt=""></button></header>
<div id="privacy-content" tabindex="0"><p class="privacy-local-note" data-i18n="privacy.localNote">本機副本，可離線閱讀。外部連結需要網路。</p><div id="privacy-document"></div></div>
<footer><a id="privacy-online" data-i18n="privacy.online" href="https://chickeneren43.github.io/document/pinballtales/privacy-policy.html" target="_blank" rel="noopener noreferrer">線上最新版 ↗</a></footer>
</dialog>
<dialog id="licenses-dialog" aria-labelledby="licenses-title">
<header><h1 id="licenses-title" data-i18n="legal.credits">授權說明</h1><button id="close-licenses" type="button" aria-label="返回" data-i18n-aria-label="common.back"><img src="img/system-marker-back.runtime.webp" alt=""></button></header>
<div id="licenses-content" tabindex="0"></div>
</dialog>
<section id="app-settings" aria-labelledby="settings-title" hidden>
<button id="close-settings" type="button" aria-label="返回" data-i18n-aria-label="common.back"><img src="img/system-marker-back.runtime.webp" alt=""></button>
<h1 id="settings-title" data-i18n="settings.title">設定</h1>
<div id="settings-content">
<div class="setting-row"><span id="language-label" data-i18n="settings.language">語言</span>
<input id="language-setting" type="hidden" value="zh-Hant">
<details id="language-menu" class="language-menu">
<summary aria-labelledby="language-label language-current"><span id="language-current">繁體中文</span><span aria-hidden="true">▾</span></summary>
<div class="language-options" role="group" aria-labelledby="language-label">
<button type="button" data-locale="zh-Hant" aria-pressed="true">繁體中文</button>
<button type="button" data-locale="zh-Hans" aria-pressed="false">简体中文</button>
<button type="button" data-locale="en" aria-pressed="false">English</button>
<button type="button" data-locale="ja" aria-pressed="false">日本語</button>
</div>
</details></div>
<label class="setting-row" for="sound-setting"><span data-i18n="settings.sound">聲音</span><input id="sound-setting" type="checkbox"></label>
<label id="haptics-row" class="setting-row" for="haptics-setting" hidden><span data-i18n="settings.haptics">振動</span><input id="haptics-setting" type="checkbox"></label>
<div class="setting-row"><label for="volume-setting" data-i18n="settings.volume">音量</label><input id="volume-setting" type="range" min="0" max="100" step="1" value="100"><output id="volume-value" for="volume-setting">100%</output></div>
<label class="setting-row" for="aspect-setting">試玩畫面比例<select id="aspect-setting"><option value="portrait">直向（原布局）</option><option value="landscape">16:9 橫向</option></select></label>
<label class="setting-row" for="launch-setting"><span data-i18n="settings.launch">發射模式</span><select id="launch-setting"><option value="hold" data-i18n="settings.hold">按住</option><option value="drag" data-i18n="settings.drag">拖曳</option></select></label>


<div id="billing-settings" hidden><button id="restore-purchases" class="settings-info-button" type="button" data-i18n="purchase.sync">同步購買資訊</button><p id="restore-purchases-status" role="status"></p></div>
<div id="clear-records-section" hidden>
<button id="clear-game-records" type="button" data-i18n="settings.clearRecords">清除遊戲紀錄</button>
<p data-i18n="settings.clearRecordsHint">清除排行榜、關卡進度及劇情已讀紀錄。</p>
</div>
<div id="settings-info">
<button id="open-privacy" class="settings-info-button" type="button"><span data-i18n="legal.privacy">隱私權政策</span><span aria-hidden="true">›</span></button>
<button id="open-licenses" class="settings-info-button" type="button"><span data-i18n="legal.credits">授權說明</span><span aria-hidden="true">›</span></button>
</div>
<p id="save-status" role="status"></p>
</div>
</section>
<dialog id="app-update-dialog" aria-labelledby="app-update-title" aria-describedby="app-update-message">
<h2 id="app-update-title" data-i18n="update.title">有新版本</h2>
<p id="app-update-message" data-i18n="update.message">有新版本可用，要前往 Google Play 更新嗎？</p>
<div class="app-update-actions"><button type="button" data-update-later data-i18n="update.later">稍後</button><button type="button" data-update-now data-i18n="update.now">前往更新</button></div>
</dialog>
<p id="load-error" role="alert" hidden></p>
</main>
<script src="js/runtime-image-variants.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="js/system/layout-renderer.js" type="application/x-pinball-pending" data-pinball-type=""></script><script src="js/system/unlock-renderer.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="js/system/menu-music.js" type="application/x-pinball-pending" data-pinball-type=""></script><script src="js/system/touhou-stage-music.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="js/system/menu-transition.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="js/system/app-updates.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="js/main.bundle.js" type="application/x-pinball-pending" data-pinball-type=""></script>
<script src="../io-audio-loader.js"></script></body>
</html>
