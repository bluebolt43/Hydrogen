<!doctype html>
<html lang="zh-Hant">
<head>
<base href="./res/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pinball · 主題選擇</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<main id="main-frame" aria-label="彈珠台主畫面">
<section id="theme-menu" aria-label="主題選擇"><canvas id="menu-art" aria-hidden="true"></canvas><div id="menu-animation" hidden></div><div id="menu-actions"></div></section>
<div id="screen" tabindex="0" hidden></div>
<div id="scene-transition" aria-hidden="true" hidden></div>
<button id="open-settings" type="button" aria-label="開啟設定"><img src="img/system-marker-settings.png" alt=""></button>
<section id="app-settings" aria-labelledby="settings-title" hidden>
<button id="close-settings" type="button" aria-label="返回遊戲"><img src="img/system-marker-back.png" alt=""></button>
<h1 id="settings-title">設定</h1>
<label class="setting-row" for="sound-setting">聲音<input id="sound-setting" type="checkbox"></label>
<div class="setting-row"><label for="volume-setting">音量</label><input id="volume-setting" type="range" min="0" max="100" step="1" value="100"><output id="volume-value" for="volume-setting">100%</output></div>
<label class="setting-row" for="launch-setting">發射模式<select id="launch-setting"><option value="hold">按住</option><option value="drag">拖曳</option></select></label>
<button id="clear-game-records" type="button" style="padding:10px 16px;background:#57312c;color:#fff0cc;border:1px solid #c38b70;border-radius:6px;cursor:pointer">清除遊戲紀錄</button>
<p style="font-size:13px">清除排行榜、關卡進度及劇情已讀紀錄。</p>
<p id="save-status" role="status"></p>
</section>
<p id="load-error" role="alert" hidden></p>
</main>
<script src="js/system/layout-renderer.js"></script>
<script src="js/system/menu-music.js"></script>
<script src="js/system/menu-transition.js"></script>
<script src="js/main.bundle.js"></script>
</body>
</html>
